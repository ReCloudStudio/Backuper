# Backuper 示例配置

# 全局配置
[global]
data_dir = "/var/lib/backuper"
listen = "127.0.0.1:8080"

# 示例规则：备份本地目录
[[rule]]
id = "docs"
schedule = "0 2 * * *"
storage = "local_backups"

[rule.source]
type = "directory"
path = "/srv/docs"

[rule.retention]
keep_last = 7
keep_days = 30

# 示例规则：备份 PostgreSQL 数据库
[[rule]]
id = "app_db"
schedule = "0 3 * * *"
storage = "local_backups"

[rule.source]
type = "postgres"
host = "localhost"
port = 5432
database = "app"
username = "backup"
password = "changeme"

[rule.retention]
keep_last = 10

# 示例规则：备份 MySQL 数据库
[[rule]]
id = "web_db"
schedule = "0 4 * * *"
storage = "remote_ssh"

[rule.source]
type = "mysql"
host = "localhost"
port = 3306
database = "web"
username = "backup"
password = "changeme"

[rule.retention]
keep_days = 14

# 本地存储后端
[[storage]]
id = "local_backups"
type = "local"
path = "/backup/backuper"

# SSH 远程存储后端
[[storage]]
id = "remote_ssh"
type = "ssh"
host = "backup.example.com"
port = 22
username = "backuper"
# key = "/etc/backuper/id_ed25519"
path = "/srv/backups"

