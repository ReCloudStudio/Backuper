[workspace]
resolver = "3"
members = [
    "crates/backuper-core",
    "crates/backuper-engine",
    "crates/backuper-daemon",
    "crates/backuper-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["RhenCloud <i@rhen.cloud>"]
license = "MIT"
repository = "https://github.com/RhenCloud/Backuper"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
async-trait = "0.1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio-cron-scheduler = { version = "0.13", features = ["signal"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
russh = "0.51"
russh-sftp = "2.0"
rust-s3 = { version = "0.37", features = ["tokio-native-tls"] }
tar = "0.4"
zstd = "0.13"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
